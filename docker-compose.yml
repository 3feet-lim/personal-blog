services:
  web:
    build:
      context: ./frontend
      # 호스트 VPN(utun)이 Docker 기본 bridge egress를 가로채므로
      # 빌드 시에만 host 네트워크로 우회해 npm 레지스트리에 접근한다.
      network: host
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Jaeyoung's Notes}
      NEXT_PUBLIC_SITE_SUBTITLE: ${NEXT_PUBLIC_SITE_SUBTITLE:-Engineering journal, since 2021}
      NEXT_PUBLIC_FOOTER_TEXT: ${NEXT_PUBLIC_FOOTER_TEXT:-© 2026 Jaeyoung Kim}
      NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-https://github.com}
      NEXT_PUBLIC_MASTODON_URL: ${NEXT_PUBLIC_MASTODON_URL:-https://mastodon.social}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: npm run dev
    depends_on:
      - api

  api:
    build:
      context: ./backend
      # 호스트 VPN(utun)이 Docker 기본 bridge egress를 가로채므로
      # 빌드 시에만 host 네트워크로 우회해 PyPI에 접근한다.
      network: host
    ports:
      - "8000:8000"
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SITE_NAME: ${NEXT_PUBLIC_APP_NAME:-Jaeyoung's Notes}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://personal_blog:personal_blog@db:5432/personal_blog}
      DEFAULT_AUTH_PROVIDER: ${DEFAULT_AUTH_PROVIDER:-google}
      ENABLE_DEMO_AUTH: ${ENABLE_DEMO_AUTH:-false}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-personal_blog_session}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/callback/google}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-personal-blog}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_blog}
      POSTGRES_USER: ${POSTGRES_USER:-personal_blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personal_blog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-personal_blog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
