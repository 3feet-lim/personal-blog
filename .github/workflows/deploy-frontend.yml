name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::637423211487:role/bigjade-blog-github-actions
  FRONTEND_BUCKET: bigjade-blog-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E24X3VDJ20EYXV
  SITE_URL: https://d1ttetuosrazth.cloudfront.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build static site
        env:
          NEXT_PUBLIC_API_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_APP_NAME: BigJade's Notes
          NEXT_PUBLIC_SITE_SUBTITLE: Engineering journal, since 2026
          NEXT_PUBLIC_FOOTER_TEXT: © 2026 BigJade
          NEXT_PUBLIC_GITHUB_URL: https://github.com
          NEXT_PUBLIC_MASTODON_URL: https://mastodon.social
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Upload to S3
        run: |
          # Hashed build assets never change, so cache them for a year.
          aws s3 sync out/_next/static "s3://$FRONTEND_BUCKET/_next/static" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync out "s3://$FRONTEND_BUCKET" \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=0,must-revalidate" \
            --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
